version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release, so a bad or compromised one is likely pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  # The Conan client that CI tests the recipe with.
  - package-ecosystem: "pip"
    directory: "/packaging/conan"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
